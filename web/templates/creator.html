{% extends "base.html" %}{% block content %}
<section><h1>UP主作品提取</h1><p>批量粘贴 UP 主空间链接；添加时会打开可见浏览器读取昵称、粉丝数与关注数。</p>
<textarea id="urls" rows="5" placeholder="https://space.bilibili.com/123456&#10;一行一个链接"></textarea><div class="actions"><button id="add" onclick="addProfiles()">添加UP主主页</button><button id="refresh" class="outline" onclick="refreshUnread()">一键读取未读取资料</button><button class="danger" onclick="clearCreators()">清空UP主列表</button><span id="author-status"></span></div>
<div class="table-wrap"><table><thead><tr><th>UP主</th><th>粉丝数</th><th>关注数</th><th>状态</th><th>主页</th></tr></thead><tbody id="authors"><tr><td colspan="5">暂无 UP 主。</td></tr></tbody></table></div></section>
<section><h2>筛选项</h2><div class="filters"><label>开始时间 <input id="start" type="datetime-local" oninput="dateMode()"></label><label>结束时间 <input id="end" type="datetime-local" oninput="dateMode()"></label><label>最新前 <input id="top" type="number" min="1" max="1000" oninput="topMode()"> 条</label></div><p class="hint">按发布时间精确到分钟筛选；填写“最新前几条”后自动取消日期范围。</p><div class="actions"><button id="extract" onclick="extract()">全部提取</button><span id="status">请先添加 UP 主并设置筛选条件。</span></div></section>
<section><div class="result-head"><h2>提取结果</h2><div><button id="download" class="outline hidden" onclick="downloadSelected()">下载勾选视频</button><button id="xlsx" class="outline hidden" onclick="exportXlsx()">导出 XLSX</button></div></div><div class="table-wrap"><table><thead><tr><th>选择</th><th>UP主</th><th>作者ID</th><th>发布时间</th><th>标题</th><th>播放量</th><th>点赞数</th><th>评论数</th><th>分享数</th><th>收藏数</th><th>链接</th></tr></thead><tbody id="results"><tr><td colspan="11">提取到的作品会即时显示在这里。</td></tr></tbody></table></div></section>
<script>
let count=0,timer=null,loading=false,downloadTimer=null;const $=id=>document.getElementById(id),urlsEl=$('urls'),addEl=$('add'),refreshEl=$('refresh'),authorStatus=$('author-status'),startEl=$('start'),endEl=$('end'),topEl=$('top'),extractEl=$('extract'),statusEl=$('status'),resultsEl=$('results'),downloadEl=$('download'),xlsxEl=$('xlsx');
function dateMode(){if(startEl.value||endEl.value)topEl.value=''}function topMode(){let active=Number(topEl.value)>0;startEl.disabled=active;endEl.disabled=active;if(active){startEl.value='';endEl.value=''}}
async function loadAuthors(){let r=await fetch('/api/creators'),j=await r.json(),rows=j.creators||[];count=rows.length;addEl.disabled=false;refreshEl.disabled=!rows.some(x=>x.profile_status!=='已读取');extractEl.disabled=!count;let b=$('authors');b.innerHTML=rows.length?'':'';for(const x of rows){b.insertAdjacentHTML('beforeend',`<tr><td>${esc(x.nickname||'资料未读取')}</td><td>${x.profile_status==='已读取'?fmt(x.follower_count):'—'}</td><td>${x.profile_status==='已读取'?fmt(x.following_count):'—'}</td><td>${esc(x.profile_status)}</td><td><a target="_blank" href="https://space.bilibili.com/${x.mid}">打开主页</a></td></tr>`)}if(!rows.length)b.innerHTML='<tr><td colspan="5">暂无 UP 主。</td></tr>'}
function esc(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}
async function addProfiles(){if(!urlsEl.value.trim())return toast('请粘贴 UP 主空间链接','warning');addEl.disabled=true;authorStatus.textContent='正在打开主页并读取资料…';try{let r=await fetch('/api/creators/add-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls:urlsEl.value})}),j=await r.json();if(!r.ok)throw new Error(j.error);urlsEl.value='';authorStatus.textContent=`已添加 ${j.added.length} 位；资料失败 ${j.failed.length} 位`;await loadAuthors()}catch(e){toast(e.message,'error');authorStatus.textContent=e.message}finally{addEl.disabled=false}}
async function refreshUnread(){refreshEl.disabled=true;try{let r=await fetch('/api/creators/refresh-unread',{method:'POST'}),j=await r.json();if(!r.ok)throw new Error(j.error);authorStatus.textContent=`已读取 ${j.refreshed}/${j.total} 位资料`;await loadAuthors()}catch(e){toast(e.message,'error')}finally{refreshEl.disabled=false}}
async function clearCreators(){if(!count||!confirm('清空全部 UP 主和其作品结果吗？'))return;let r=await fetch('/api/creators',{method:'DELETE'}),j=await r.json();if(!r.ok)return toast(j.error,'error');await loadAuthors();await loadResults()}
function selected(){return [...document.querySelectorAll('.select:checked')].map(x=>x.value)}function updateDownload(){let n=selected().length;downloadEl.disabled=!n;downloadEl.textContent=n?`下载勾选视频（${n}）`:'下载勾选视频'}
async function loadResults(){let r=await fetch('/api/creator-results'),j=await r.json(),b=resultsEl;b.innerHTML='';for(const x of j.rows){b.insertAdjacentHTML('beforeend',`<tr><td><input checked class="select" type="checkbox" value="${x.id}" onchange="updateDownload()"></td><td>${esc(x.author_name)}</td><td>${esc(x.author_mid)}</td><td>${x.publish_time}</td><td>${esc(x.title)}</td><td>${fmt(x.view_count)}</td><td>${fmt(x.like_count)}</td><td>${fmt(x.comment_count)}</td><td>${fmt(x.share_count)}</td><td>${fmt(x.favorite_count)}</td><td><a target="_blank" href="${x.video_url}">打开作品</a></td></tr>`)}if(!j.rows.length)b.innerHTML='<tr><td colspan="11">正在等待符合条件的作品…</td></tr>';xlsxEl.classList.toggle('hidden',!j.rows.length);downloadEl.classList.toggle('hidden',!j.rows.length);updateDownload()}
async function poll(){try{let r=await fetch('/api/creator-status'),s=await r.json();if(s.running){statusEl.textContent=`正在提取 ${s.current}/${s.total}：${s.name}；${s.message}`;if(!loading){loading=true;try{await loadResults()}finally{loading=false}}}}catch(_){}}
async function extract(){if(!count)return toast('请先添加 UP 主','warning');if(!topEl.value&&(!startEl.value||!endEl.value))return toast('请选择日期范围或填写前几条','warning');extractEl.disabled=true;resultsEl.innerHTML='<tr><td colspan="11">已清空上次结果，正在提取…</td></tr>';timer=setInterval(poll,800);try{let r=await fetch('/api/creator-extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({start_at:startEl.value,end_at:endEl.value,top_count:topEl.value})}),j=await r.json();if(!r.ok)throw new Error(j.error);statusEl.textContent=`完成：${j.total} 条；失败 ${j.failed.length} 位 UP 主`;await loadResults()}catch(e){statusEl.textContent=e.message;toast(e.message,'error')}finally{clearInterval(timer);extractEl.disabled=false}}
async function pollDownload(){let r=await fetch('/api/download-status'),d=await r.json();if(d.running){statusEl.textContent=`正在下载 ${d.done+d.failed}/${d.total}：${d.message}`;return}if(downloadTimer){clearInterval(downloadTimer);downloadTimer=null;statusEl.textContent=d.message;toast(d.message,d.failed?'warning':'success')}}
async function downloadSelected(){let ids=selected();if(!ids.length)return;downloadEl.disabled=true;try{let r=await fetch('/api/downloads/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})}),j=await r.json();if(!r.ok)throw new Error(j.error);if(j.cancelled)return;statusEl.textContent=`正在下载 ${j.total} 条到 ${j.path}`;downloadTimer=setInterval(pollDownload,800)}catch(e){toast(e.message,'error')}finally{updateDownload()}}
async function exportXlsx(){xlsxEl.disabled=true;try{let r=await fetch('/api/results/creator/export-xlsx/save',{method:'POST'}),j=await r.json();if(!r.ok)throw new Error(j.error);if(!j.cancelled)toast(`已导出：${j.path}`,'success')}catch(e){toast(e.message,'error')}finally{xlsxEl.disabled=false}}
loadAuthors();loadResults();
</script>{% endblock %}
