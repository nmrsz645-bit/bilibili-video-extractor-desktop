{% extends "base.html" %}{% block content %}
<section><h1>哔哩哔哩话题提取</h1><p>输入搜索关键词、#话题名，或直接粘贴哔哩哔哩话题/搜索页面链接。符合筛选条件的视频会实时显示。</p>
<label>关键词或话题链接</label><input id="topic" placeholder="AI绘画、#旅行攻略 或 https://www.bilibili.com/...">
</section>
<section><h2>筛选项</h2><div class="filters"><label>开始时间 <input id="start" type="datetime-local"></label><label>结束时间 <input id="end" type="datetime-local"></label><label>最多提取 <input id="max" type="number" min="1" max="1000" value="100"> 条</label></div><p class="hint">按发布时间精确到分钟筛选；达到指定条数即停止继续检索。</p><div class="actions"><button id="extract" onclick="extractTopic()">开始提取</button><button id="pause-extract" class="outline hidden" onclick="togglePause()">暂停提取</button><span id="status">请输入关键词或话题链接并设置筛选条件。</span></div></section>
<section><div class="result-head"><h2>话题提取结果</h2><div><button id="download" class="outline hidden" onclick="downloadSelected()">下载勾选视频</button><button id="xlsx" class="outline hidden" onclick="exportXlsx()">导出 XLSX</button></div></div><div class="table-wrap"><table><thead><tr><th>选择</th><th>UP主</th><th>作者ID</th><th>发布时间</th><th>标题</th><th>播放量</th><th>点赞数</th><th>评论数</th><th>分享数</th><th>收藏数</th><th>链接</th></tr></thead><tbody id="results"><tr><td colspan="11">符合条件的视频会即时显示在这里。</td></tr></tbody></table></div></section>
<script>
let timer=null,loading=false,downloadTimer=null,wasRunning=false,pauseBusy=false,lastFound=null;const $=id=>document.getElementById(id),esc=v=>{const d=document.createElement('div');d.textContent=v||'';return d.innerHTML};
function selected(){return [...document.querySelectorAll('.select:checked')].map(x=>x.value)}function updateDownload(){let n=selected().length,b=$('download');b.disabled=!n;b.textContent=n?`下载勾选视频（${n}）`:'下载勾选视频'}
async function loadResults(){let r=await fetch('/api/topic-results'),j=await r.json(),b=$('results');b.innerHTML='';for(const x of j.rows)b.insertAdjacentHTML('beforeend',`<tr><td><input checked class="select" type="checkbox" value="${x.id}" onchange="updateDownload()"></td><td>${esc(x.author_name)}</td><td>${esc(x.author_mid)}</td><td>${x.publish_time}</td><td>${esc(x.title)}</td><td>${fmt(x.view_count)}</td><td>${fmt(x.like_count)}</td><td>${fmt(x.comment_count)}</td><td>${fmt(x.share_count)}</td><td>${fmt(x.favorite_count)}</td><td><a target="_blank" href="${x.video_url}">打开作品</a></td></tr>`);if(!j.rows.length)b.innerHTML='<tr><td colspan="11">正在等待符合条件的视频…</td></tr>';$('xlsx').classList.toggle('hidden',!j.rows.length);$('download').classList.toggle('hidden',!j.rows.length);updateDownload()}
async function poll(){try{let r=await fetch('/api/topic-status'),s=await r.json(),b=$('pause-extract');b.classList.toggle('hidden',!s.running);b.textContent=s.paused?'继续提取':'暂停提取';b.disabled=pauseBusy;if(s.running){wasRunning=true;$('extract').disabled=true;let phase=s.paused?(s.pause_waiting?'已暂停':'正在暂停'):'正在提取';$('status').textContent=`${phase} ${s.label}：${s.message}（${s.found}/${s.total}）`;if(!loading&&lastFound!==s.found){loading=true;try{await loadResults();lastFound=s.found}finally{loading=false}}}else if(wasRunning){wasRunning=false;$('extract').disabled=false;$('status').textContent=s.message}}catch(_){}}
async function togglePause(){let b=$('pause-extract');pauseBusy=true;b.disabled=true;try{let action=b.textContent==='继续提取'?'resume':'pause',r=await fetch(`/api/extract/topic/${action}`,{method:'POST'}),j=await r.json();if(!r.ok)throw new Error(j.error);await poll()}catch(e){toast(e.message,'error')}finally{pauseBusy=false;b.disabled=false}}
async function extractTopic(){let topic=$('topic').value.trim(),start=$('start').value,end=$('end').value,max=$('max').value;if(!topic)return toast('请输入关键词或话题链接','warning');if(!start||!end||!max)return toast('请填写完整日期范围和最多提取条数','warning');$('extract').disabled=true;lastFound=null;$('results').innerHTML='<tr><td colspan="11">已清空上次结果，正在提取…</td></tr>';try{let r=await fetch('/api/topic-extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,start_at:start,end_at:end,max_results:max})}),j=await r.json();if(!r.ok)throw new Error(j.error);$('status').textContent=`完成：${j.total} 条符合条件的视频`;await loadResults()}catch(e){$('status').textContent=e.message;toast(e.message,'error')}finally{$('extract').disabled=false;await poll()}}
async function pollDownload(){let r=await fetch('/api/download-status'),d=await r.json();if(d.running){$('status').textContent=`正在下载 ${d.done+d.failed}/${d.total}：${d.message}`;return}if(downloadTimer){clearInterval(downloadTimer);downloadTimer=null;$('status').textContent=d.message;toast(d.message,d.failed?'warning':'success')}}
async function downloadSelected(){let ids=selected();if(!ids.length)return;$('download').disabled=true;try{let r=await fetch('/api/downloads/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})}),j=await r.json();if(!r.ok)throw new Error(j.error);if(j.cancelled)return;$('status').textContent=`正在下载 ${j.total} 条到 ${j.path}`;downloadTimer=setInterval(pollDownload,800)}catch(e){toast(e.message,'error')}finally{updateDownload()}}
async function exportXlsx(){$('xlsx').disabled=true;try{let r=await fetch('/api/results/topic/export-xlsx/save',{method:'POST'}),j=await r.json();if(!r.ok)throw new Error(j.error);if(!j.cancelled)toast(`已导出：${j.path}`,'success')}catch(e){toast(e.message,'error')}finally{$('xlsx').disabled=false}}
loadResults();poll();timer=setInterval(poll,800);
</script>{% endblock %}
