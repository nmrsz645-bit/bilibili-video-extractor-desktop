{% extends "base.html" %}{% block content %}
<section><h1>哔哩哔哩单作品提取</h1><p>每行粘贴一个哔哩哔哩视频链接或整行分享文案。每成功读取一条会立即显示。</p><textarea id="urls" rows="8" placeholder="https://www.bilibili.com/video/BV...&#10;https://b23.tv/..."></textarea><div class="actions"><button id="extract" onclick="extractVideos()">开始提取</button><span id="status">粘贴视频链接后开始提取。</span></div></section>
<section><div class="result-head"><h2>单作品提取结果</h2><div><button id="download" class="outline hidden" onclick="downloadSelected()">下载勾选视频</button><button id="xlsx" class="outline hidden" onclick="exportXlsx()">导出 XLSX</button></div></div><div class="table-wrap"><table><thead><tr><th>选择</th><th>UP主</th><th>作者ID</th><th>发布时间</th><th>标题</th><th>播放量</th><th>点赞数</th><th>评论数</th><th>分享数</th><th>收藏数</th><th>链接</th></tr></thead><tbody id="results"><tr><td colspan="11">提取到的视频会即时显示在这里。</td></tr></tbody></table></div></section>
<script>
let timer=null,loading=false,downloadTimer=null;const $=id=>document.getElementById(id),esc=v=>{const d=document.createElement('div');d.textContent=v||'';return d.innerHTML};
function selected(){return [...document.querySelectorAll('.select:checked')].map(x=>x.value)}function updateDownload(){let n=selected().length,b=$('download');b.disabled=!n;b.textContent=n?`下载勾选视频（${n}）`:'下载勾选视频'}
async function loadResults(){let r=await fetch('/api/single-results'),j=await r.json(),b=$('results');b.innerHTML='';for(const x of j.rows)b.insertAdjacentHTML('beforeend',`<tr><td><input checked class="select" type="checkbox" value="${x.id}" onchange="updateDownload()"></td><td>${esc(x.author_name)}</td><td>${esc(x.author_mid)}</td><td>${x.publish_time}</td><td>${esc(x.title)}</td><td>${fmt(x.view_count)}</td><td>${fmt(x.like_count)}</td><td>${fmt(x.comment_count)}</td><td>${fmt(x.share_count)}</td><td>${fmt(x.favorite_count)}</td><td><a target="_blank" href="${x.video_url}">打开作品</a></td></tr>`);if(!j.rows.length)b.innerHTML='<tr><td colspan="11">正在等待视频资料…</td></tr>';$('xlsx').classList.toggle('hidden',!j.rows.length);$('download').classList.toggle('hidden',!j.rows.length);updateDownload()}
async function poll(){try{let r=await fetch('/api/single-status'),s=await r.json();if(s.running){$('status').textContent=`正在读取 ${s.current}/${s.total}：${s.message}（成功 ${s.found} 条）`;if(!loading){loading=true;try{await loadResults()}finally{loading=false}}}}catch(_){}}
async function extractVideos(){let urls=$('urls').value.trim();if(!urls)return toast('请逐行粘贴视频链接','warning');$('extract').disabled=true;$('results').innerHTML='<tr><td colspan="11">已清空上次结果，正在读取…</td></tr>';timer=setInterval(poll,700);try{let r=await fetch('/api/single-extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls})}),j=await r.json();if(!r.ok)throw new Error(j.error);$('status').textContent=`完成：成功 ${j.total} 条，失败 ${j.failed.length} 条`;await loadResults()}catch(e){$('status').textContent=e.message;toast(e.message,'error')}finally{clearInterval(timer);$('extract').disabled=false}}
async function pollDownload(){let r=await fetch('/api/download-status'),d=await r.json();if(d.running){$('status').textContent=`正在下载 ${d.done+d.failed}/${d.total}：${d.message}`;return}if(downloadTimer){clearInterval(downloadTimer);downloadTimer=null;$('status').textContent=d.message;toast(d.message,d.failed?'warning':'success')}}
async function downloadSelected(){let ids=selected();if(!ids.length)return;$('download').disabled=true;try{let r=await fetch('/api/downloads/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})}),j=await r.json();if(!r.ok)throw new Error(j.error);if(j.cancelled)return;$('status').textContent=`正在下载 ${j.total} 条到 ${j.path}`;downloadTimer=setInterval(pollDownload,800)}catch(e){toast(e.message,'error')}finally{updateDownload()}}
async function exportXlsx(){$('xlsx').disabled=true;try{let r=await fetch('/api/results/single/export-xlsx/save',{method:'POST'}),j=await r.json();if(!r.ok)throw new Error(j.error);if(!j.cancelled)toast(`已导出：${j.path}`,'success')}catch(e){toast(e.message,'error')}finally{$('xlsx').disabled=false}}
loadResults();
</script>{% endblock %}
